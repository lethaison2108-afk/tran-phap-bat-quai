<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trận Pháp Bát Quái 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #050508;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
    }
    .hud-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(15, 22, 36, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(180, 225, 255, 0.25);
      box-shadow: 0 0 20px rgba(100, 180, 255, 0.2);
      padding: 10px 22px;
      border-radius: 50px;
      color: #e6f4ff;
      z-index: 100;
      user-select: none;
      white-space: nowrap;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-weight: 700;
      color: #7dd3fc;
      text-shadow: 0 0 8px rgba(125, 211, 252, 0.6);
    }
    .divider {
      width: 1px;
      height: 18px;
      background: rgba(180, 225, 255, 0.25);
    }
    .star-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: #fde047;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .star-btn:hover {
      background: rgba(250, 204, 21, 0.25);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
      transform: translateY(-1px);
    }
    .star-btn:active {
      transform: scale(0.92);
    }
    .star-btn.starred {
      background: rgba(250, 204, 21, 0.3);
      border-color: #fde047;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    }
    .star-icon {
      font-size: 16px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .star-btn:hover .star-icon {
      transform: rotate(72deg) scale(1.15);
    }
    @media (max-width: 480px) {
      .hud-panel {
        padding: 8px 14px;
        gap: 10px;
      }
      .stat-item, .star-btn {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <canvas id="baguaCanvas"></canvas>

  <div class="hud-panel">
    <div class="stat-item" title="Tổng số người truy cập">
      <span>👁️ Truy cập:</span>
      <span class="stat-value" id="visitCount">...</span>
    </div>
    <div class="divider"></div>
    <button class="star-btn" id="starBtn" onclick="handleStar()">
      <span class="star-icon">⭐</span>
      <span>Thả sao:</span>
      <span id="starCount">...</span>
    </button>
  </div>

  <script>
    const canvas = document.getElementById('baguaCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, cx, cy, scale;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      cx = width / 2;
      cy = height / 2;
      scale = Math.min(width, height) / 850;
    }
    window.addEventListener('resize', resize);
    resize();

    const baguaTrigrams = ['☰', '☱', '☲', '☳', '☴', '☵', '☶', '☷'];
    const heavenlyStems = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    const earthlyBranches = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const directions = ['乾', '坎', '艮', '震', '巽', '離', '坤', '兌'];
    const hexagrams64 = Array.from({ length: 64 }, (_, i) => String.fromCharCode(0x4DC0 + i));

    const particles = Array.from({ length: 70 }, () => ({
      angle: Math.random() * Math.PI * 2,
      radius: Math.random() * 400 + 40,
      speed: (Math.random() - 0.5) * 0.008,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.7 + 0.2
    }));

    let shootingStars = [];

    function spawnFloatingStar() {
      for (let i = 0; i < 10; i++) {
        shootingStars.push({
          x: cx + (Math.random() - 0.5) * 140,
          y: height - 60,
          vx: (Math.random() - 0.5) * 3.5,
          vy: -(Math.random() * 3.5 + 2),
          size: Math.random() * 10 + 14,
          alpha: 1
        });
      }
    }

    function drawYinYang(radius, angle) {
      ctx.save();
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, radius, -Math.PI / 2, Math.PI / 2);
      ctx.fillStyle = '#08080c';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -radius / 2, radius / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, radius / 2, radius / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#08080c';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -radius / 2, radius / 6, 0, Math.PI * 2);
      ctx.fillStyle = '#08080c';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, radius / 2, radius / 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function drawTextRing(items, radius, fontSize, angle, showDividers = true) {
      ctx.save();
      ctx.rotate(angle);
      ctx.font = `${fontSize}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(235, 245, 255, 0.92)';

      const step = (Math.PI * 2) / items.length;

      for (let i = 0; i < items.length; i++) {
        const theta = i * step;
        ctx.save();
        ctx.rotate(theta);
        ctx.translate(0, -radius);
        ctx.fillText(items[i], 0, 0);
        ctx.restore();

        if (showDividers) {
          const divAngle = theta + step / 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(divAngle) * (radius - fontSize * 0.7), Math.sin(divAngle) * (radius - fontSize * 0.7));
          ctx.lineTo(Math.cos(divAngle) * (radius + fontSize * 0.7), Math.sin(divAngle) * (radius + fontSize * 0.7));
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    function drawCircleBorder(radius, lineWidth = 1, alpha = 0.5, dash = []) {
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash(dash);
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      ctx.restore();
    }

    function drawTicks(innerR, outerR, count, angle, alpha = 0.4) {
      ctx.save();
      ctx.rotate(angle);
      ctx.strokeStyle = `rgba(220, 240, 255, ${alpha})`;
      ctx.lineWidth = 1;
      const step = (Math.PI * 2) / count;
      for (let i = 0; i < count; i++) {
        const a = i * step;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * innerR, Math.sin(a) * innerR);
        ctx.lineTo(Math.cos(a) * outerR, Math.sin(a) * outerR);
        ctx.stroke();
      }
      ctx.restore();
    }

    let time = 0;

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.85)';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      ctx.shadowBlur = 14;
      ctx.shadowColor = 'rgba(180, 225, 255, 0.85)';

      drawYinYang(32, time * 0.8);
      drawCircleBorder(40, 1.5, 0.8);

      drawTextRing(baguaTrigrams, 62, 22, -time * 0.5, true);
      drawCircleBorder(82, 1.2, 0.6);

      drawTextRing(directions, 102, 16, time * 0.4, true);
      drawCircleBorder(120, 1, 0.5);

      drawTextRing([...heavenlyStems, ...heavenlyStems], 142, 15, -time * 0.35, true);
      drawCircleBorder(162, 1.5, 0.7);

      drawTicks(166, 176, 72, time * 0.2, 0.5);
      drawCircleBorder(180, 1, 0.4);

      const mountain24 = [...heavenlyStems.slice(0, 8), ...earthlyBranches, ...directions.slice(0, 4)];
      drawTextRing(mountain24, 202, 15, time * 0.3, true);
      drawCircleBorder(222, 1.5, 0.75);

      drawTextRing(hexagrams64, 252, 22, -time * 0.25, true);
      drawCircleBorder(278, 2, 0.85);

      drawTicks(284, 296, 120, -time * 0.15, 0.45);
      drawCircleBorder(300, 1, 0.5);

      const outerChars = [...earthlyBranches, ...heavenlyStems, ...earthlyBranches, ...heavenlyStems];
      drawTextRing(outerChars, 322, 14, time * 0.18, true);
      drawCircleBorder(342, 1.5, 0.7);
      drawCircleBorder(352, 0.8, 0.35, [6, 6]);

      ctx.shadowBlur = 8;
      particles.forEach(p => {
        p.angle += p.speed;
        const px = Math.cos(p.angle) * p.radius;
        const py = Math.sin(p.angle) * p.radius;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 240, 255, ${p.alpha})`;
        ctx.fill();
      });

      ctx.restore();

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        s.x += s.vx;
        s.y += s.vy;
        s.alpha -= 0.018;
        ctx.save();
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.font = `${s.size}px sans-serif`;
        ctx.fillText('⭐', s.x, s.y);
        ctx.restore();
        if (s.alpha <= 0) {
          shootingStars.splice(i, 1);
        }
      }

      time += 0.015;
      requestAnimationFrame(animate);
    }

    animate();

    // ========================================================
    // HỆ THỐNG ĐỒNG BỘ LƯỢT TRUY CẬP & SỐ SAO THỜI GIAN THỰC
    // ========================================================
    const NAMESPACE = 'lethaison-batquai-v3';
    const API_BASE = 'https://abacus.jasoncameron.dev';
    const visitEl = document.getElementById('visitCount');
    const starEl = document.getElementById('starCount');
    const starBtn = document.getElementById('starBtn');

    let hasStarred = localStorage.getItem('bagua_v3_starred') === 'true';
    if (hasStarred) {
      starBtn.classList.add('starred');
    }

    async function syncCount(key, action = 'get') {
      try {
        const url = `${API_BASE}/${action}/${NAMESPACE}/${key}?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();
        return typeof data.value === 'number' ? data.value : 0;
      } catch (err) {
        return null;
      }
    }

    function renderStats(visits, stars) {
      if (visits !== null) visitEl.innerText = visits.toLocaleString('vi-VN');
      if (stars !== null) starEl.innerText = stars.toLocaleString('vi-VN');
    }

    async function initStats() {
      const [visits, stars] = await Promise.all([
        syncCount('visits', 'hit'),
        syncCount('stars', 'get')
      ]);
      renderStats(visits, stars);
    }

    setInterval(async () => {
      const [latestVisits, latestStars] = await Promise.all([
        syncCount('visits', 'get'),
        syncCount('stars', 'get')
      ]);
      renderStats(latestVisits, latestStars);
    }, 5000);

    async function handleStar() {
      spawnFloatingStar();
      if (hasStarred) return;

      hasStarred = true;
      localStorage.setItem('bagua_v3_starred', 'true');
      starBtn.classList.add('starred');

      const newStarCount = await syncCount('stars', 'hit');
      if (newStarCount !== null) {
        starEl.innerText = newStarCount.toLocaleString('vi-VN');
      }
    }

    initStats();
  </script>
</body>
</html>
