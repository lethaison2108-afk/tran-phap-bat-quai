<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy Tính Cầm Tay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121218;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background-color: #1e1e26;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 320px;
    }

    .display {
      background-color: #14141a;
      color: #ffffff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      word-wrap: break-word;
      word-break: break-all;
    }

    .previous-operand {
      color: #8e8e9e;
      font-size: 16px;
      min-height: 22px;
    }

    .current-operand {
      color: #ffffff;
      font-size: 32px;
      font-weight: 600;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 58px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      background-color: #2a2a36;
      color: #ffffff;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: #363646;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background-color: #323244;
      color: #4cc9f0;
      font-weight: 600;
    }

    .operator:hover {
      background-color: #3f3f56;
    }

    .action {
      background-color: #3a2a32;
      color: #ff5c8a;
    }

    .action:hover {
      background-color: #4d3540;
    }

    .equals {
      background-color: #4361ee;
      color: #ffffff;
      grid-column: span 2;
      font-weight: 600;
    }

    .equals:hover {
      background-color: #3a56d4;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous"></div>
      <div class="current-operand" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="action" onclick="clearAll()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('÷')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('×')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let shouldResetScreen = false;

    const currentDisplay = document.getElementById('current');
    const previousDisplay = document.getElementById('previous');

    function updateDisplay() {
      currentDisplay.innerText = currentInput;
      if (operation != null) {
        previousDisplay.innerText = `${previousInput} ${operation}`;
      } else {
        previousDisplay.innerText = '';
      }
    }

    function appendNumber(number) {
      if (currentInput === '0' || shouldResetScreen) {
        currentInput = number === '.' ? '0.' : number;
        shouldResetScreen = false;
      } else {
        if (number === '.' && currentInput.includes('.')) return;
        currentInput += number;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (op === '%') {
        currentInput = (parseFloat(currentInput) / 100).toString();
        updateDisplay();
        return;
      }
      if (operation !== null && !shouldResetScreen) {
        calculate();
      }
      previousInput = currentInput;
      operation = op;
      shouldResetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (operation === null || shouldResetScreen) return;
      const prev = parseFloat(previousInput);
      const current = parseFloat(currentInput);
      if (isNaN(prev) || isNaN(current)) return;

      let result;
      switch (operation) {
        case '+':
          result = prev + current;
          break;
        case '-':
          result = prev - current;
          break;
        case '×':
          result = prev * current;
          break;
        case '÷':
          if (current === 0) {
            alert('Không thể chia cho 0!');
            clearAll();
            return;
          }
          result = prev / current;
          break;
        default:
          return;
      }

      // Làm tròn để tránh lỗi số thực trong JavaScript (vd: 0.1 + 0.2)
      currentInput = Math.round(result * 100000000) / 100000000 + '';
      operation = null;
      previousInput = '';
      shouldResetScreen = true;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operation = null;
      shouldResetScreen = false;
      updateDisplay();
    }

    function deleteLast() {
      if (shouldResetScreen) return;
      if (currentInput.length === 1 || (currentInput.length === 2 && currentInput.startsWith('-'))) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    // Hỗ trợ nhập từ bàn phím máy tính
    window.addEventListener('keydown', (e) => {
      if (e.key >= 0 && e.key <= 9) appendNumber(e.key);
      if (e.key === '.') appendNumber('.');
      if (e.key === '=' || e.key === 'Enter') {
        e.preventDefault();
        calculate();
      }
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearAll();
      if (e.key === '+' || e.key === '-') appendOperator(e.key);
      if (e.key === '*') appendOperator('×');
      if (e.key === '/') {
        e.preventDefault();
        appendOperator('÷');
      }
      if (e.key === '%') appendOperator('%');
    });
  </script>
</body>
</html>
